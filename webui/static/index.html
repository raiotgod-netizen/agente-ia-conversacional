<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agent</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--surface:#12121a;--border:#1e1e2e;--accent:#00d4ff;--accent2:#7c3aed;--text:#e0e0e0;--text2:#888;--user-bg:#1a1a2e;--ai-bg:#0d1117}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* Header */
.header{padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.header .logo{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px}
.header .info{flex:1}
.header .info h1{font-size:16px;font-weight:600}
.header .info span{font-size:11px;color:var(--text2)}
.status-dot{width:8px;height:8px;border-radius:50%;background:#4caf50}
.status-dot.offline{background:#f44336}

/* Chat */
.chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:80%;padding:12px 16px;border-radius:12px;line-height:1.5;font-size:14px;animation:fadeIn .2s}
.msg.user{align-self:flex-end;background:var(--user-bg);border:1px solid var(--border)}
.msg.ai{align-self:flex-start;background:var(--ai-bg);border:1px solid var(--border)}
.msg.ai pre{background:#000;padding:8px;border-radius:6px;overflow-x:auto;font-size:12px;margin-top:8px}
.msg.ai code{font-family:'Consolas',monospace;font-size:12px}
.typing{display:flex;gap:4px;padding:12px 16px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:bounce .6s infinite}
.typing span:nth-child(2){animation-delay:.1s}
.typing span:nth-child(3){animation-delay:.2s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Input area */
.input-area{padding:16px 20px;background:var(--surface);border-top:1px solid var(--border)}
.input-row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;resize:none;min-height:44px;max-height:120px;font-family:inherit;outline:none;transition:border-color .2s}
textarea:focus{border-color:var(--accent)}
textarea::placeholder{color:var(--text2)}
.btn{width:44px;height:44px;border-radius:8px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:18px}
.btn-send{background:var(--accent);color:#000}
.btn-send:hover{background:#00b8d4}
.btn-send:disabled{opacity:.3;cursor:not-allowed}
.btn-mic{background:var(--surface);border:1px solid var(--border);color:var(--text)}
.btn-mic:hover{border-color:var(--accent)}
.btn-mic.recording{background:#f44336;border-color:#f44336;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(244,67,54,.4)}50%{box-shadow:0 0 0 8px rgba(244,67,54,0)}}

/* Footer */
.footer{padding:8px 20px;text-align:center;font-size:11px;color:var(--text2);background:var(--surface);border-top:1px solid var(--border)}

/* Toast */
.toast{position:fixed;top:20px;right:20px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:13px;z-index:100;animation:slideIn .3s}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">AI</div>
  <div class="info">
    <h1>AI Agent</h1>
    <span id="model-info">Conectando...</span>
  </div>
  <div class="status-dot offline" id="status-dot"></div>
</div>

<div class="chat" id="chat">
  <div class="msg ai">Hola, soy tu asistente de IA. Puedo ejecutar comandos, buscar en internet, leer archivos y mas. En que puedo ayudarte?</div>
</div>

<div class="input-area">
  <div class="input-row">
    <textarea id="input" placeholder="Escribe un mensaje..." rows="1"></textarea>
    <button class="btn btn-mic" id="mic-btn" title="Dictar por voz">🎤</button>
    <button class="btn btn-send" id="send-btn" title="Enviar">▶</button>
  </div>
</div>

<div class="footer">AI Agent Kit — Modelos locales y cloud</div>

<script>
// ═══════════════════════════════════════════
// CONFIGURACION
// ═══════════════════════════════════════════
const GATEWAY = 'http://localhost:8642';
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const micBtn = document.getElementById('mic-btn');
const statusDot = document.getElementById('status-dot');
const modelInfo = document.getElementById('model-info');

let isListening = false;
let recognition = null;
let isProcessing = false;

// ═══════════════════════════════════════════
// CONEXION
// ═══════════════════════════════════════════
async function checkHealth() {
  try {
    const r = await fetch(`${GATEWAY}/health`);
    const d = await r.json();
    statusDot.classList.remove('offline');
    modelInfo.textContent = `${d.model} (${d.provider})`;
    return true;
  } catch {
    statusDot.classList.add('offline');
    modelInfo.textContent = 'Sin conexion';
    return false;
  }
}

// ═══════════════════════════════════════════
// CHAT
// ═══════════════════════════════════════════
function addMessage(text, isUser) {
  const div = document.createElement('div');
  div.className = `msg ${isUser ? 'user' : 'ai'}`;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing';
  div.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || isProcessing) return;
  
  isProcessing = true;
  sendBtn.disabled = true;
  input.value = '';
  input.style.height = 'auto';
  
  addMessage(text, true);
  addTyping();
  
  try {
    const r = await fetch(`${GATEWAY}/chat`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    });
    const d = await r.json();
    removeTyping();
    addMessage(d.response || d.error || 'Sin respuesta', false);
  } catch (e) {
    removeTyping();
    addMessage('Error de conexion: ' + e.message, false);
  }
  
  isProcessing = false;
  sendBtn.disabled = false;
  input.focus();
}

// ═══════════════════════════════════════════
// VOZ - STT (Speech-to-Text)
// ═══════════════════════════════════════════
function initSpeech() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    micBtn.style.display = 'none';
    return;
  }
  
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'es-ES';
  recognition.continuous = false;
  recognition.interimResults = true;
  
  recognition.onresult = (e) => {
    let transcript = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      transcript += e.results[i][0].transcript;
    }
    input.value = transcript;
    input.style.height = 'auto';
    input.style.height = input.scrollHeight + 'px';
  };
  
  recognition.onend = () => {
    isListening = false;
    micBtn.classList.remove('recording');
    if (input.value.trim()) sendMessage();
  };
  
  recognition.onerror = () => {
    isListening = false;
    micBtn.classList.remove('recording');
  };
}

function toggleMic() {
  if (!recognition) return;
  
  if (isListening) {
    recognition.stop();
    isListening = false;
    micBtn.classList.remove('recording');
  } else {
    recognition.start();
    isListening = true;
    micBtn.classList.add('recording');
  }
}

// ═══════════════════════════════════════════
// VOZ - TTS (Text-to-Speech)
// ═══════════════════════════════════════════
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  
  // Limpiar texto de codigo y emojis
  const clean = text.replace(/```[\s\S]*?```/g, ' bloque de codigo ')
                     .replace(/[^\w\s.,;:!?¡¿áéíóúñü]/g, '')
                     .trim();
  
  if (!clean) return;
  
  const utterance = new SpeechSynthesisUtterance(clean);
  utterance.lang = 'es-ES';
  utterance.rate = 1.0;
  utterance.pitch = 1.0;
  speechSynthesis.speak(utterance);
}

// ═══════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════
function showToast(msg, duration = 3000) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), duration);
}

// ═══════════════════════════════════════════
// EVENTOS
// ═══════════════════════════════════════════
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

sendBtn.addEventListener('click', sendMessage);
micBtn.addEventListener('click', toggleMic);

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
checkHealth();
initSpeech();
setInterval(checkHealth, 30000);
input.focus();
</script>
</body>
</html>
