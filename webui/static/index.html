<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
        #header { padding: 12px 20px; background: rgba(20,20,30,0.95); border-bottom: 1px solid rgba(255,136,0,0.2); display: flex; align-items: center; gap: 12px; }
        #header h1 { font-size: 16px; color: #ff8800; letter-spacing: 2px; font-weight: 300; }
        #status-dot { width: 8px; height: 8px; border-radius: 50%; background: #00cc66; transition: background 0.3s; }
        #status-dot.thinking { background: #ffcc00; animation: pulse 1s infinite; }
        #status-dot.speaking { background: #00aaff; }
        #status-dot.error { background: #ff4444; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        #status-text { font-size: 11px; color: #888; }
        #model-info { font-size: 10px; color: #555; margin-left: auto; }
        
        #chat { flex: 1; overflow-y: auto; padding: 15px 20px; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
        .msg.user { align-self: flex-end; background: rgba(255,136,0,0.12); border: 1px solid rgba(255,136,0,0.25); }
        .msg.ai { align-self: flex-start; background: rgba(25,25,40,0.9); border: 1px solid rgba(255,255,255,0.08); }
        .msg.tool { align-self: flex-start; background: rgba(0,80,180,0.12); border: 1px solid rgba(0,80,180,0.25); font-family: 'Consolas', monospace; font-size: 11px; color: #6ab0ff; }
        .msg.system { align-self: center; background: none; color: #555; font-size: 11px; font-style: italic; }
        
        #input-bar { padding: 12px 20px; background: rgba(20,20,30,0.95); border-top: 1px solid rgba(255,136,0,0.2); display: flex; gap: 8px; align-items: center; }
        #msg { flex: 1; padding: 10px 14px; background: rgba(25,25,40,0.9); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; color: #e0e0e0; font-size: 13px; outline: none; }
        #msg:focus { border-color: rgba(255,136,0,0.4); }
        .btn { padding: 10px 18px; border: 1px solid rgba(255,136,0,0.3); border-radius: 8px; background: rgba(255,136,0,0.1); color: #ff8800; cursor: pointer; font-size: 12px; transition: all 0.2s; }
        .btn:hover { background: rgba(255,136,0,0.2); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn.active { background: rgba(255,50,50,0.3); border-color: rgba(255,50,50,0.5); color: #ff5555; }
        #mic-btn { font-size: 16px; }
        
        #tool-panel { display: none; padding: 8px 20px; background: rgba(15,15,25,0.95); border-top: 1px solid rgba(255,136,0,0.1); font-size: 11px; color: #888; max-height: 80px; overflow-y: auto; }
        #tool-panel.show { display: block; }
        .tool-entry { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .tool-entry b { color: #6ab0ff; }
    </style>
</head>
<body>
    <div id="header">
        <div id="status-dot"></div>
        <h1>AI AGENT</h1>
        <span id="status-text">LISTO</span>
        <span id="model-info">...</span>
    </div>
    
    <div id="chat">
        <div class="msg system">Conectado al gateway. Escribe un mensaje o presiona el microfono para hablar.</div>
    </div>
    
    <div id="tool-panel"></div>
    
    <div id="input-bar">
        <button class="btn" id="mic-btn" onclick="toggleMic()" title="Hablar (Click)">🎤</button>
        <input type="text" id="msg" placeholder="Escribe tu mensaje..." autofocus>
        <button class="btn" id="send-btn" onclick="send()">Enviar</button>
        <button class="btn" onclick="toggleTools()" title="Tools">⚡</button>
        <button class="btn" onclick="clearChat()" title="Limpiar">🗑</button>
    </div>

<script>
const GW = location.hostname + ':8642';
const chat = document.getElementById('chat');
const msgInput = document.getElementById('msg');
const sendBtn = document.getElementById('send-btn');
const micBtn = document.getElementById('mic-btn');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const modelInfo = document.getElementById('model-info');
const toolPanel = document.getElementById('tool-panel');

let processing = false;
let recognition = null;
let speaking = false;
let toolHistory = [];

// ─── Init ───
fetch(`http://${GW}/health`).then(r=>r.json()).then(d=>{
    modelInfo.textContent = d.model || 'desconocido';
}).catch(()=>{ modelInfo.textContent = 'sin conexion'; });

// ─── Mensajes ───
function addMsg(text, cls) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
}

function setStatus(s, text) {
    statusDot.className = 'status-dot ' + s;
    statusText.textContent = text || s.toUpperCase();
}

// ─── Enviar mensaje ───
async function send() {
    const text = msgInput.value.trim();
    if (!text || processing) return;
    
    processing = true;
    sendBtn.disabled = true;
    msgInput.value = '';
    addMsg(text, 'user');
    setStatus('thinking', 'PENSANDO');
    
    const typing = addMsg('...', 'ai');
    
    try {
        const r = await fetch(`http://${GW}/chat`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: text})
        });
        const d = await r.json();
        typing.remove();
        
        if (d.response) {
            const resp = addMsg(d.response, 'ai');
            // TTS automatico
            speak(d.response);
        } else if (d.error) {
            addMsg('Error: ' + d.error, 'system');
        }
    } catch(e) {
        typing.remove();
        addMsg('Error de conexion: ' + e.message, 'system');
    }
    
    processing = false;
    sendBtn.disabled = false;
    setStatus('idle', 'LISTO');
}

msgInput.addEventListener('keypress', e => { if (e.key === 'Enter') send(); });

// ─── Voz (STT) ───
function toggleMic() {
    if (recognition) { recognition.stop(); recognition = null; micBtn.classList.remove('active'); return; }
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        addMsg('SpeechRecognition no disponible en este navegador', 'system');
        return;
    }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang = 'es-CL';
    recognition.continuous = false;
    recognition.interimResults = false;
    
    recognition.onstart = () => { micBtn.classList.add('active'); setStatus('listening', 'ESCUCHANDO'); };
    recognition.onresult = (e) => {
        const text = e.results[0][0].transcript;
        msgInput.value = text;
        send();
    };
    recognition.onerror = (e) => { micBtn.classList.remove('active'); setStatus('idle', 'LISTO'); };
    recognition.onend = () => { micBtn.classList.remove('active'); if (!processing) setStatus('idle', 'LISTO'); };
    recognition.start();
}

// ─── Voz (TTS) ───
function speak(text) {
    if (!text || speaking) return;
    // Solo leer las primeras 200 palabras
    const short = text.split(' ').slice(0, 200).join(' ');
    const u = new SpeechSynthesisUtterance(short);
    u.lang = 'es-CL';
    u.rate = 1.0;
    u.onstart = () => { speaking = true; setStatus('speaking', 'HABLANDO'); };
    u.onend = () => { speaking = false; setStatus('idle', 'LISTO'); };
    u.onerror = () => { speaking = false; setStatus('idle', 'LISTO'); };
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
}

// ─── Tools Panel ───
function toggleTools() { toolPanel.classList.toggle('show'); }

function logTool(name, args, result) {
    toolHistory.push({name, args, result: (result||'').substring(0, 200), ts: new Date().toLocaleTimeString()});
    toolPanel.innerHTML = toolHistory.slice(-10).reverse().map(t =>
        `<div class="tool-entry"><b>[${t.ts}] ${t.name}</b> → ${t.result.substring(0, 80)}</div>`
    ).join('');
}

// ─── Limpiar ───
function clearChat() {
    chat.innerHTML = '<div class="msg system">Chat limpiado.</div>';
    toolHistory = [];
    toolPanel.innerHTML = '';
}

// ─── Keyboard shortcuts ───
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { speechSynthesis.cancel(); speaking = false; setStatus('idle', 'LISTO'); }
    if (e.ctrlKey && e.key === 'l') { e.preventDefault(); clearChat(); }
});
</script>
</body>
</html>
