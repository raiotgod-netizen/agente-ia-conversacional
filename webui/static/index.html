<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agent Core</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0a0f;overflow:hidden;
  background-image:radial-gradient(circle at 50% 50%,rgba(20,35,60,0.3) 0%,transparent 80%),
  linear-gradient(rgba(18,24,38,0.2) 1px,transparent 1px),
  linear-gradient(90deg,rgba(18,24,38,0.2) 1px,transparent 1px);
  background-size:100% 100%,40px 40px,40px 40px;
  font-family:'Consolas','Courier New',monospace;
  cursor:default;user-select:none;color:#e0e0e0}

/* ─── Status Dot ─── */
#status-dot{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;z-index:999;transition:.3s}
#status-dot.idle{background:#ff8800;box-shadow:0 0 8px rgba(255,136,0,0.5)}
#status-dot.listening{background:#44ff44;box-shadow:0 0 12px rgba(68,255,68,0.6);animation:pulse-green 1s infinite}
#status-dot.thinking{background:#ffaa00;box-shadow:0 0 12px rgba(255,170,0,0.6);animation:pulse-yellow .6s infinite}
#status-dot.speaking{background:#ff4444;box-shadow:0 0 16px rgba(255,68,68,0.7);animation:pulse-red .4s infinite}
#status-dot.offline{background:#666;box-shadow:0 0 4px rgba(100,100,100,0.3)}
#status-dot.error{background:#ff0000;box-shadow:0 0 8px rgba(255,0,0,0.5)}
@keyframes pulse-green{0%,100%{opacity:.6;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.3)}}
@keyframes pulse-yellow{0%,100%{opacity:.5;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.4)}}
@keyframes pulse-red{0%,100%{opacity:.5;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.2)}}

/* ─── HUD Window ─── */
.window{position:fixed;background:rgba(5,8,15,0.85);border:1px solid rgba(255,136,0,0.15);border-radius:8px;backdrop-filter:blur(12px);box-shadow:0 0 20px rgba(255,100,0,0.05),inset 0 0 30px rgba(255,80,0,0.02);z-index:10;transform-style:preserve-3d}
.win-title{height:24px;background:rgba(40,25,0,0.5);border-radius:7px 7px 0 0;display:flex;align-items:center;justify-content:space-between;padding:0 8px;border-bottom:1px solid rgba(255,136,0,0.1);font-size:8px;letter-spacing:1px;color:rgba(255,170,0,0.7)}
.win-body{padding:8px;font-size:10px;color:rgba(255,170,0,0.6);overflow:hidden}

/* ─── Chat Window ─── */
#win-chat{top:40px;left:50%;transform:translateX(-50%);width:500px;height:calc(100vh - 100px);display:flex;flex-direction:column}
#win-chat .win-body{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:4px 8px}
#chat-log{flex:1;overflow-y:auto;font-size:11px;line-height:1.5;color:rgba(255,200,0,0.8);scrollbar-width:thin;scrollbar-color:rgba(255,136,0,0.2) transparent}
#chat-log::-webkit-scrollbar{width:4px}
#chat-log::-webkit-scrollbar-track{background:transparent}
#chat-log::-webkit-scrollbar-thumb{background:rgba(255,136,0,0.2);border-radius:2px}
.msg{margin:4px 0;padding:6px 8px;border-radius:4px}
.msg.user{text-align:right;color:rgba(100,200,255,0.8)}
.msg.ai{color:rgba(255,200,0,0.8)}
.msg.error{color:rgba(255,80,80,0.8);font-size:9px}
.msg pre{background:rgba(0,0,0,0.5);padding:4px;border-radius:3px;overflow-x:auto;font-size:9px;margin:4px 0;border:1px solid rgba(255,136,0,0.1)}
.msg code{font-family:'Consolas',monospace;font-size:9px}
.typing{color:rgba(255,170,0,0.4);font-size:9px;animation:blink 1s infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

/* ─── Transcript ─── */
#transcript{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(5,8,15,0.9);border:1px solid rgba(255,136,0,0.2);border-radius:6px;padding:8px 16px;font-size:12px;color:rgba(255,200,0,0.8);z-index:100;max-width:400px;text-align:center;backdrop-filter:blur(8px);display:none}
#transcript.show{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
#transcript .interim{color:rgba(255,170,0,0.4);font-style:italic}

/* ─── Input Bar ─── */
#input-bar{display:flex;align-items:center;gap:4px;padding:4px 0;border-top:1px solid rgba(255,136,0,0.1);margin-top:4px}
#input-bar .prompt{color:rgba(255,170,0,0.5);font-size:10px}
#input{flex:1;background:transparent;border:none;outline:none;color:rgba(255,200,0,0.85);font-family:'Consolas',monospace;font-size:11px}
#input::placeholder{color:rgba(255,136,0,0.2)}
#mic-status{color:rgba(255,170,0,0.3);font-size:8px;margin-left:8px}
#mic-status.active{color:rgba(68,255,68,0.6)}
#send-btn{background:none;border:1px solid rgba(255,136,0,0.2);border-radius:3px;color:rgba(255,170,0,0.5);cursor:pointer;font-size:10px;padding:2px 8px;transition:.2s}
#send-btn:hover{border-color:rgba(255,170,0,0.5);color:rgba(255,200,0,0.8)}

/* ─── Info Window ─── */
#win-info{top:40px;right:20px;width:180px}
.stat-row{display:flex;justify-content:space-between;margin:2px 0;font-size:8px;color:rgba(255,150,0,0.5)}
.stat-row .val{color:rgba(255,200,0,0.9);font-weight:bold}
.bar-bg{height:3px;background:rgba(255,100,0,0.1);border-radius:2px;margin:1px 0 4px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;transition:width .3s}
.bar-fill.cpu{background:linear-gradient(90deg,#ff6600,#ffaa00)}
.bar-fill.ram{background:linear-gradient(90deg,#ff8800,#ffcc44)}

/* ─── Clock Window ─── */
#win-clock{bottom:20px;right:20px;width:180px}
.clock-display{font-size:24px;font-weight:bold;text-align:center;color:rgba(255,200,0,0.85);text-shadow:0 0 15px rgba(255,150,0,0.2);letter-spacing:2px}
.clock-date{text-align:center;font-size:8px;color:rgba(255,150,0,0.35);margin-top:2px;letter-spacing:1px}

/* ─── Terminal Window ─── */
#win-term{bottom:20px;left:20px;width:250px;height:150px}
#term-log{font-size:8px;line-height:1.4;color:rgba(255,170,0,0.5);overflow-y:auto;height:calc(100% - 24px);scrollbar-width:thin;scrollbar-color:rgba(255,136,0,0.2) transparent}
#term-log::-webkit-scrollbar{width:3px}
#term-log::-webkit-scrollbar-thumb{background:rgba(255,136,0,0.2);border-radius:2px}
.term-line{margin:1px 0}
.term-line .prompt{color:rgba(255,200,0,0.3)}
.term-line .cmd{color:rgba(255,200,0,0.7)}
.term-line .ok{color:rgba(255,170,0,0.4)}
.term-line .err{color:rgba(255,80,80,0.5)}

/* ─── Scan Line ─── */
.scan-line{position:fixed;top:0;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,200,0,0.15),transparent);z-index:5;pointer-events:none;animation:scan 8s linear infinite}
@keyframes scan{0%{top:0}100%{top:100vh}}

/* ─── Toast ─── */
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(5,8,15,0.9);border:1px solid rgba(255,136,0,0.25);border-radius:4px;padding:6px 12px;font-size:9px;color:rgba(255,170,0,0.7);z-index:100;transition:transform .4s cubic-bezier(0.175,0.885,0.32,1.275);backdrop-filter:blur(8px)}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="scan-line"></div>
<div id="status-dot" class="offline"></div>

<!-- Chat Window -->
<div class="window" id="win-chat">
  <div class="win-title">
    <span>AI AGENT</span>
    <span id="model-label">...</span>
  </div>
  <div class="win-body">
    <div id="chat-log">
      <div class="msg ai">Sistema inicializado. Microfono activo — hable normalmente.</div>
    </div>
    <div id="input-bar">
      <span class="prompt">></span>
      <input id="input" placeholder="Escribe o habla..." autocomplete="off">
      <span id="mic-status">MIC OFF</span>
      <button id="send-btn" title="Enviar">ENVIAR</button>
    </div>
  </div>
</div>

<!-- Transcript -->
<div id="transcript"><span id="transcript-text"></span><span class="interim" id="transcript-interim"></span></div>

<!-- Info Window -->
<div class="window" id="win-info">
  <div class="win-title"><span>SISTEMA</span></div>
  <div class="win-body">
    <div class="stat-row"><span>CPU</span><span class="val" id="cpu-val">--%</span></div>
    <div class="bar-bg"><div class="bar-fill cpu" id="cpu-bar" style="width:0%"></div></div>
    <div class="stat-row"><span>RAM</span><span class="val" id="ram-val">--%</span></div>
    <div class="bar-bg"><div class="bar-fill ram" id="ram-bar" style="width:0%"></div></div>
    <div class="stat-row"><span>PROVIDER</span><span class="val" id="provider-val">--</span></div>
    <div class="stat-row"><span>TOOLS</span><span class="val" id="tools-val">--</span></div>
    <div class="stat-row"><span>STATUS</span><span class="val" id="conn-val">OFFLINE</span></div>
    <div class="stat-row"><span>VOICE</span><span class="val" id="voice-val">OFF</span></div>
  </div>
</div>

<!-- Clock Window -->
<div class="window" id="win-clock">
  <div class="win-title"><span>RELOJ</span></div>
  <div class="win-body">
    <div class="clock-display" id="clock-time">00:00:00</div>
    <div class="clock-date" id="clock-date">--</div>
  </div>
</div>

<!-- Terminal Window -->
<div class="window" id="win-term">
  <div class="win-title"><span>LOG</span></div>
  <div class="win-body" style="padding:4px">
    <div id="term-log"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════
const GATEWAY = 'http://localhost:8642';
const chatLog = document.getElementById('chat-log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const statusDot = document.getElementById('status-dot');
const termLog = document.getElementById('term-log');
const transcript = document.getElementById('transcript');
const transcriptText = document.getElementById('transcript-text');
const transcriptInterim = document.getElementById('transcript-interim');
const micStatus = document.getElementById('mic-status');

let recognition = null;
let isProcessing = false;
let finalTranscript = '';
let silenceTimeout = null;
let isMicActive = false;

// ═══════════════════════════════════════════
// LOG
// ═══════════════════════════════════════════
function termLog_(text, type='ok') {
  const div = document.createElement('div');
  div.className = 'term-line';
  div.innerHTML = `<span class="prompt">> </span><span class="${type}">${text}</span>`;
  termLog.appendChild(div);
  termLog.scrollTop = termLog.scrollHeight;
}

// ═══════════════════════════════════════════
// CLOCK
// ═══════════════════════════════════════════
function updateClock() {
  const now = new Date();
  document.getElementById('clock-time').textContent = now.toLocaleTimeString('es-CL');
  document.getElementById('clock-date').textContent = now.toLocaleDateString('es-CL', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
}
setInterval(updateClock, 1000);
updateClock();

// ═══════════════════════════════════════════
// HEALTH
// ═══════════════════════════════════════════
async function checkHealth() {
  try {
    const r = await fetch(`${GATEWAY}/health`);
    const d = await r.json();
    statusDot.className = isMicActive ? 'listening' : 'idle';
    document.getElementById('provider-val').textContent = d.provider;
    document.getElementById('conn-val').textContent = 'ONLINE';
    document.getElementById('conn-val').style.color = '#44ff88';
    document.getElementById('model-label').textContent = d.model;
    termLog_('Gateway online: ' + d.model);
    
    const tr = await fetch(`${GATEWAY}/tools`);
    const td = await tr.json();
    document.getElementById('tools-val').textContent = td.tools.length;
    termLog_('Tools: ' + td.tools.join(', '));
    return true;
  } catch {
    statusDot.className = 'offline';
    document.getElementById('conn-val').textContent = 'OFFLINE';
    document.getElementById('conn-val').style.color = '#ff4444';
    termLog_('Gateway offline', 'err');
    return false;
  }
}

// ═══════════════════════════════════════════
// CHAT
// ═══════════════════════════════════════════
function addMsg(text, type='ai') {
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  div.textContent = text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

function setTyping(on) {
  let t = document.getElementById('typing');
  if (on && !t) {
    t = document.createElement('div');
    t.id = 'typing';
    t.className = 'typing';
    t.textContent = 'Procesando...';
    chatLog.appendChild(t);
    chatLog.scrollTop = chatLog.scrollHeight;
  } else if (!on && t) {
    t.remove();
  }
}

async function send(text) {
  const msg = text || input.value.trim();
  if (!msg || isProcessing) return;
  
  isProcessing = true;
  sendBtn.disabled = true;
  input.value = '';
  statusDot.className = 'thinking';
  
  addMsg(msg, 'user');
  termLog_('>> ' + msg.substring(0, 60));
  setTyping(true);
  
  try {
    const r = await fetch(`${GATEWAY}/chat`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: msg})
    });
    const d = await r.json();
    setTyping(false);
    const response = d.response || d.error || 'Sin respuesta';
    addMsg(response);
    termLog_('<< ' + response.substring(0, 60));
    
    // TTS: hablar respuesta
    speak(response);
  } catch (e) {
    setTyping(false);
    addMsg('Error: ' + e.message, 'error');
    termLog_('Error: ' + e.message, 'err');
  }
  
  statusDot.className = isMicActive ? 'listening' : 'idle';
  isProcessing = false;
  sendBtn.disabled = false;
  input.focus();
}

// ═══════════════════════════════════════════
// VOZ - STT (Always Listening)
// ═══════════════════════════════════════════
function initSpeech() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    micStatus.textContent = 'NO VOICE';
    termLog_('SpeechRecognition no disponible', 'err');
    return;
  }
  
  recognition = new SpeechRecognition();
  recognition.continuous = true;      // Siempre escuchando
  recognition.interimResults = true;  // Resultados parciales
  recognition.lang = 'es-CL';
  recognition.maxAlternatives = 1;
  
  recognition.onstart = () => {
    isMicActive = true;
    micStatus.textContent = 'MIC ON';
    micStatus.classList.add('active');
    statusDot.className = 'listening';
    document.getElementById('voice-val').textContent = 'ACTIVE';
    document.getElementById('voice-val').style.color = '#44ff88';
    termLog_('Microfono activo — escuchando');
    finalTranscript = '';
  };
  
  recognition.onresult = (event) => {
    let interim = '';
    let final = '';
    
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const result = event.results[i];
      if (result.isFinal) {
        final += result[0].transcript + ' ';
      } else {
        interim += result[0].transcript;
      }
    }
    
    // Mostrar transcript
    if (final || interim) {
      transcript.classList.add('show');
      transcriptText.textContent = finalTranscript + final;
      transcriptInterim.textContent = interim ? ' ' + interim : '';
    }
    
    if (final) {
      finalTranscript += final;
      
      // Barge-in: si esta procesando, ignorar
      if (isProcessing) {
        finalTranscript = '';
        return;
      }
      
      // Reset silence timeout
      if (silenceTimeout) clearTimeout(silenceTimeout);
      
      // Esperar 1.5s de silencio antes de enviar
      silenceTimeout = setTimeout(() => {
        const text = finalTranscript.trim();
        finalTranscript = '';
        transcript.classList.remove('show');
        
        if (text.length > 2) {
          termLog_('Voz: ' + text.substring(0, 50));
          send(text);
        }
      }, 1500);
    }
  };
  
  recognition.onend = () => {
    // Auto-reiniciar si no estamos procesando
    if (!isProcessing) {
      try {
        recognition.start();
      } catch (e) {
        termLog_('Error reiniciando mic: ' + e.message, 'err');
      }
    }
  };
  
  recognition.onerror = (e) => {
    if (e.error === 'no-speech') {
      // Normal, simplemente no hablaron
      return;
    }
    termLog_('Error STT: ' + e.error, 'err');
    
    // Reiniciar en caso de error
    if (e.error !== 'aborted' && !isProcessing) {
      setTimeout(() => {
        try { recognition.start(); } catch {}
      }, 1000);
    }
  };
  
  // Iniciar automaticamente
  try {
    recognition.start();
    termLog_('Iniciando SpeechRecognition...');
  } catch (e) {
    termLog_('Error iniciando STT: ' + e.message, 'err');
  }
}

// ═══════════════════════════════════════════
// VOZ - TTS
// ═══════════════════════════════════════════
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  
  // Cancelar cualquier voz en curso
  speechSynthesis.cancel();
  
  // Limpiar texto
  const clean = text.replace(/```[\s\S]*?```/g, ' bloque de codigo ')
                     .replace(/`[^`]*`/g, ' codigo ')
                     .replace(/[^\w\s.,;:!?¡¿áéíóúñü]/g, '')
                     .trim();
  
  if (!clean) return;
  
  statusDot.className = 'speaking';
  
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'es-CL';
  u.rate = 1.0;
  u.pitch = 1.0;
  
  u.onend = () => {
    statusDot.className = isMicActive ? 'listening' : 'idle';
  };
  
  u.onerror = () => {
    statusDot.className = isMicActive ? 'listening' : 'idle';
  };
  
  speechSynthesis.speak(u);
}

// ═══════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ═══════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
sendBtn.addEventListener('click', () => send());

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
termLog_('Iniciando AI Agent Core...');
termLog_('Modo manos libres — microfono siempre activo');
checkHealth();
initSpeech();
setInterval(checkHealth, 30000);
input.focus();
</script>
</body>
</html>
