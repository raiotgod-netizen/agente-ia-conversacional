version: '3.8'

services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ai-agent-gateway
    ports:
      - "8642:8642"
    volumes:
      # Montar configuracion
      - ../gateway/config.json:/app/gateway/config.json
      # Montar datos persistentes
      - ai-agent-data:/app/data
      # Montar memoria
      - ../gateway/memory.json:/app/gateway/memory.json
    environment:
      # URL de Ollama (si usa modelos locales)
      - OLLAMA_URL=http://host.docker.internal:11434
      # Provider (override de config.json)
      - PROVIDER=${PROVIDER:-ollama}
      # API Key (si usa cloud)
      - API_KEY=${API_KEY:-}
      # Modelo (override de config.json)
      - MODEL=${MODEL:-qwen3:8b}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8642/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  webui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ai-agent-webui
    command: python webui/server.py
    ports:
      - "8787:8787"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ai-agent-data:
    driver: local
